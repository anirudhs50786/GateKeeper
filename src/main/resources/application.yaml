server:
  port: 8063
  servlet:
    context-path: /opencart

spring:
  application:
    name: gatekeeper-server
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# Run the custom API Gateway Auth Filter and verify JWT
moto-cart:
  security:
    header-auth:
      enabled: false

jwt:
  secret:
    public: 

logging:
  level:
    root: INFO